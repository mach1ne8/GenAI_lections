name: Python tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
          pip install pytest pytest-cov requests

      - name: Run tests with coverage
        working-directory: 3_1_LLM_agent
        run: |
          python -m pytest \
            --cov=llm_agent.tool_http_request \
            --cov-report=term \
            --cov-report=json:coverage.json

      - name: Get coverage percentage
        working-directory: 3_1_LLM_agent
        run: |
          COVERAGE=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          echo "COVERAGE=${COVERAGE}%" >> "$GITHUB_ENV"
          echo "Coverage: ${COVERAGE}%"

      - name: Create coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 15b654ef40e65bc3e6c557e8366b8c08
          filename: GenAI_lections_coverage.json
          label: Coverage
          message: ${{ env.COVERAGE }}
          color: green
